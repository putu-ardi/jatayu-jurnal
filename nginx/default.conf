map $request_method $login_limit_key {
    default "";
    POST $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=captcha:10m rate=30r/m;
limit_req_zone $login_limit_key zone=login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=google_start:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=google_callback:10m rate=30r/m;

upstream ejls_web {
    server web:3000;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /api/auth/captcha {
        limit_req zone=general burst=40 nodelay;
        limit_req zone=captcha burst=9 nodelay;
        limit_req_status 429;
        proxy_pass http://ejls_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ~ "^/api/auth/captcha/[A-Za-z0-9_-]{43}/image$" {
        limit_req zone=general burst=40 nodelay;
        limit_req zone=captcha burst=9 nodelay;
        limit_req_status 429;
        proxy_pass http://ejls_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /login {
        limit_req zone=general burst=40 nodelay;
        limit_req zone=login burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://ejls_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /api/auth/google/start {
        limit_req zone=general burst=40 nodelay;
        limit_req zone=google_start burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://ejls_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /api/auth/google/callback {
        access_log off;
        limit_req zone=general burst=40 nodelay;
        limit_req zone=google_callback burst=9 nodelay;
        limit_req_status 429;
        proxy_pass http://ejls_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /api/auth/google/link/callback {
        access_log off;
        limit_req zone=general burst=40 nodelay;
        limit_req zone=google_callback burst=9 nodelay;
        limit_req_status 429;
        proxy_pass http://ejls_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        limit_req zone=general burst=40 nodelay;
        proxy_pass http://ejls_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
